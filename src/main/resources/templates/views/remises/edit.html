<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier Tarifs | Compagnie aérienne</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .remise-grid {
            overflow-x: auto;
        }
        .remise-grid table {
            width: 100%;
            border-collapse: collapse;
        }
        .remise-grid th, .remise-grid td {
            padding: 12px 16px;
            text-align: center;
            border: 1px solid var(--border-color, #e0e0e0);
        }
        .remise-grid th {
            background: var(--primary-light, #e3f2fd);
            font-weight: 600;
        }
        .remise-grid th.classe-header {
            background: var(--primary-color, #1976d2);
            color: white;
        }
        .remise-grid td.categorie-header {
            background: var(--secondary-light, #f5f5f5);
            font-weight: 500;
            text-align: left;
        }
        .pourcentage-input {
            width: 80px;
            padding: 8px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        .pourcentage-input:focus {
            outline: none;
            border-color: var(--primary-color, #1976d2);
            box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.2);
        }
        .info-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 16px;
            margin-bottom: 24px;
            border-radius: 4px;
        }
        .info-box h4 {
            margin: 0 0 8px 0;
            color: #856404;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn-cancel {
            background: #6c757d;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
        }
        .btn-save {
            background: var(--primary-color, #1976d2);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
        }
        .btn-save:hover {
            background: #1565c0;
        }
    </style>
</head>
<body>

<div class="app-shell">
    <div th:replace="ui/menu :: menu"></div>

    <main class="main-area">

        <header class="main-header">
            <div>
                <h1>Modifier la Grille Tarifaire</h1>
            </div>
            <div class="user-chip">
                <span class="status-dot"></span>
                <span>Module Tarifs</span>
            </div>
        </header>

        <section class="content-section">
            <div class="info-box">
                <h4><i class="bi bi-exclamation-triangle"></i> Attention</h4>
                <p>Les modifications affecteront les <strong>nouveaux vols</strong> créés. Les vols existants conserveront leurs tarifs actuels.</p>
            </div>
        </section>

        <form action="/remises/edit" method="post">
            <section class="table-wrapper">
                <header>
                    <h2 class="section-title">Saisie des Pourcentages</h2>
                </header>

                <div class="remise-grid">
                    <table>
                        <thead>
                            <tr>
                                <th>Catégorie \ Classe</th>
                                <th th:each="classe : ${classes}" class="classe-header" th:text="${classe.libelle}"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="categorie : ${categories}">
                                <td class="categorie-header" th:text="${categorie.libelle}"></td>
                                <td th:each="classe : ${classes}">
                                    <input type="number" 
                                           class="pourcentage-input"
                                           th:name="'remise_' + ${classe.idClasse} + '_' + ${categorie.idCategorie}"
                                           th:value="${#numbers.formatDecimal(matrice[classe.idClasse][categorie.idCategorie], 1, 0)}"
                                           min="0" max="200" step="1">
                                    <span>%</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="btn-group">
                    <a href="/remises" class="btn-cancel">Annuler</a>
                    <button type="submit" class="btn-save">Enregistrer les modifications</button>
                </div>
            </section>
        </form>

    </main>
</div>

</body>
</html>
