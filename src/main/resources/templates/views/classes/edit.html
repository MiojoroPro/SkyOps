<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier Classe | Compagnie aerienne</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<div class="app-shell">
    <div th:replace="ui/menu :: menu"></div>

    <main class="main-area">

        <header class="main-header">
            <div>
                <h1>Modifier la classe de siege</h1>
            </div>
        </header>

        <section class="content-section">
            <article class="card">

                <form th:action="@{/classes/edit/{id}(id=${classe.idClasse})}" th:object="${classe}" method="post">

                    <div class="form-group">
                        <label>Code (3 caracteres max)</label>
                        <input type="text" th:field="*{code}" maxlength="3" required />
                    </div>

                    <div class="form-group">
                        <label>Libelle</label>
                        <input type="text" th:field="*{libelle}" required />
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-save">Modifier</button>
                        <a href="/classes" class="btn btn-secondary">Annuler</a>
                    </div>

                </form>

            </article>
        </section>

    </main>
</div>

</body>
</html>
