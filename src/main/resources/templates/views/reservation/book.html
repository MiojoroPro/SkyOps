<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réserver | Compagnie aérienne</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<div class="app-shell">
    <div th:replace="ui/menu :: menu"></div>

    <main class="main-area">
        <header class="main-header">
            <div>
                <h1>Réserver un siège</h1>
            </div>
        </header>

        <section class="content-section">
            <article class="card">
                <p class="section-title">Détails du vol</p>
                <p><strong>Vol :</strong> <span th:text="${detail.vol.numeroVol}"></span></p>
                <p><strong>Avion :</strong> <span th:text="${detail.avion.modele}"></span></p>
                <p><strong>Départ :</strong> <span th:text="${#temporals.format(detail.dateHeureDepart,'yyyy-MM-dd HH:mm')}"></span></p>
                <p><strong>Arrivée :</strong> <span th:text="${#temporals.format(detail.dateHeureArrivee,'yyyy-MM-dd HH:mm')}"></span></p>
                <p><strong>Prix éco :</strong>
                    <span th:text="${detail.prixEconomique != null ? #numbers.formatDecimal(detail.prixEconomique,0,0) + ' MGA' : '—'}"></span>
                    — <em th:text="'Places restantes: ' + (detail.placesEcoRestantes != null ? detail.placesEcoRestantes : 0)"></em></p>
                <p><strong>Prix première :</strong>
                    <span th:text="${detail.prixPremiere != null ? #numbers.formatDecimal(detail.prixPremiere,0,0) + ' MGA' : '—'}"></span>
                    — <em th:text="'Places restantes: ' + (detail.placesPremiereRestantes != null ? detail.placesPremiereRestantes : 0)"></em></p>
                <p><strong>Prix premium :</strong>
                    <span th:text="${detail.prixPremium != null ? #numbers.formatDecimal(detail.prixPremium,0,0) + ' MGA' : '—'}"></span>
                    — <em th:text="'Places restantes: ' + (detail.placesPremiumRestantes != null ? detail.placesPremiumRestantes : 0)"></em></p>
                <p><strong>Recette maximale:</strong> <span th:text="${detail.maxRevenue != null ? #numbers.formatDecimal(detail.maxRevenue,0,0) + ' MGA' : '—'}"></span></p>

                <h3 class="section-title">Formulaire de réservation</h3>
                <div th:if="${error}" class="form-error" th:text="${error}"></div>
                <form th:action="@{/reservations/book/{id}(id=${detail.idVolDetail})}" th:object="${reservation}" method="post">

                    <div class="form-group">
                        <label>Client</label>
                        <select th:field="*{utilisateur.idUtilisateur}" required>
                            <option value="">Sélectionner un client</option>
                            <option th:each="u : ${utilisateurs}"
                                    th:value="${u.idUtilisateur}"
                                    th:text="${u.nom} + ' ' + ${u.prenom} + ' (' + ${u.email} + ')'"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Classe</label>
                        <select th:field="*{classe}" required>
                            <option value="">Sélectionner la classe</option>
                            <option value="ECONOMIQUE">Économique</option>
                            <option value="PREMIERE">Première</option>
                            <option value="PREMIUM">Premium</option>
                        </select>
                        <span class="form-help">Choisissez la classe du siège à réserver</span>
                    </div>

                    <div class="form-group">
                        <label>Numéro de réservation (généré)</label>
                        <input type="text" th:field="*{numeroReservation}" readonly placeholder="Généré automatiquement"/>
                    </div>

                    <div class="form-group">
                        <label>Payer maintenant</label>
                        <input type="checkbox" name="payerMaintenant" />
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-add">Confirmer la réservation</button>
                        <a th:href="@{/vol/{id}/details(id=${detail.vol.idVol})}" class="btn btn-secondary">Retour</a>
                    </div>

                    <div class="form-group">
                        <p class="form-help">Après confirmation, un enregistrement de paiement sera créé (simulation).</p>
                    </div>

                </form>

            </article>
        </section>

    </main>
</div>

</body>
</html>
