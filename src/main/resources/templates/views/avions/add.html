<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter Avion</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .capacity-section { margin-top: 20px; }
        .capacity-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .capacity-item { padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .capacity-item label { font-weight: bold; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="app-shell">
    <div th:replace="ui/menu :: menu"></div>

    <main class="main-area">

        <header class="main-header">
            <div>
                <h1>Ajouter un avion</h1>
            </div>
        </header>

        <section class="content-section">
            <article class="card">

                <form th:action="@{/avions/add}" method="post" th:object="${avion}">

                    <div class="form-group">
                        <label>Compagnie</label>
                        <select th:field="*{compagnie}" required>
                            <option value="">Sélectionner une compagnie</option>
                            <option th:each="c : ${compagnies}"
                                    th:value="${c.idCompagnie}"
                                    th:text="${c.nom}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Modèle</label>
                        <input type="text" th:field="*{modele}" required>
                    </div>

                    <div class="form-group">
                        <label>Statut</label>
                        <select th:field="*{statut}" required>
                            <option value="">Sélectionner un statut</option>
                            <option value="DISPONIBLE">DISPONIBLE</option>
                            <option value="MAINTENANCE">MAINTENANCE</option>
                            <option value="HORS_SERVICE">HORS SERVICE</option>
                        </select>
                    </div>

                    <!-- Capacités par classe de siège -->
                    <div class="capacity-section">
                        <h3>Capacité par classe de siège</h3>
                        <p style="color: #666; margin-bottom: 15px;">Définissez le nombre de sièges pour chaque classe</p>
                        
                        <div class="capacity-grid">
                            <div th:each="classe : ${classes}" class="capacity-item">
                                <label th:text="${classe.libelle}">Classe</label>
                                <input type="number" 
                                       th:name="'capacite_' + ${classe.idClasse}" 
                                       min="0" 
                                       value="0" 
                                       placeholder="Nombre de sièges" />
                            </div>
                            <div th:if="${classes == null or classes.isEmpty()}" style="color: #999;">
                                Aucune classe de siège configurée
                            </div>
                        </div>
                    </div>

                    <div class="form-actions" style="margin-top: 20px;">
                        <button type="submit" class="btn btn-add">Ajouter</button>
                        <a href="/avions" class="btn btn-secondary">Annuler</a>
                    </div>

                </form>

            </article>
        </section>

    </main>
</div>

</body>
</html>
