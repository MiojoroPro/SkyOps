<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter Avion</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<div class="app-shell">
    <div th:replace="ui/menu :: menu"></div>

    <main class="main-area">

        <header class="main-header">
            <div>
                <h1>Ajouter un avion</h1>
            </div>
        </header>

        <section class="content-section">
            <article class="card">

                <form th:action="@{/avions/add}" method="post" th:object="${avion}">

                    <div class="form-group">
                        <label>Compagnie</label>
                        <select th:field="*{compagnie}" required>
                            <option value="">Sélectionner une compagnie</option>
                            <option th:each="c : ${compagnies}"
                                    th:value="${c.idCompagnie}"
                                    th:text="${c.nom}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Modèle</label>
                        <input type="text" th:field="*{modele}" required>
                    </div>

                    <div class="form-group">
                        <label>Capacité</label>
                        <input type="number" th:field="*{capacite}" required>
                    </div>

                    <div class="form-group">
                        <label>Statut</label>
                        <select th:field="*{statut}" required>
                            <option value="">Sélectionner un statut</option>
                            <option value="DISPONIBLE">DISPONIBLE</option>
                            <option value="MAINTENANCE">MAINTENANCE</option>
                            <option value="HORS_SERVICE">HORS SERVICE</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Ajouter</button>
                        <a href="/avions" class="btn-secondary">Annuler</a>
                    </div>

                </form>

            </article>
        </section>

    </main>
</div>

</body>
</html>
