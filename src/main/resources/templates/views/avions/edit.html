<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modifier Avion | Compagnie aérienne</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
    <style>
        .capacity-section { margin-top: 20px; }
        .capacity-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .capacity-item { padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .capacity-item label { font-weight: bold; display: block; margin-bottom: 5px; }
    </style>
</head>

<body>
<div class="app-shell">
    <div th:replace="ui/menu :: menu"></div>

    <main class="main-area">
        <header class="main-header">
            <div>
                <h1>Modifier un avion</h1>
            </div>
            <div class="user-chip">
                <span class="status-dot"></span>
                <span>Module Avions</span>
            </div>
        </header>

        <section class="form-wrapper">
            <form th:action="@{/avions/edit/{id}(id=${avion.idAvion})}"
                  method="post"
                  th:object="${avion}">

                <!-- Compagnie -->
                <div class="form-group">
                    <label>Compagnie</label>
                    <select th:field="*{compagnie}" required>
                        <option value="">Sélectionnez une compagnie</option>
                        <option th:each="c : ${compagnies}"
                                th:value="${c.idCompagnie}"
                                th:text="${c.nom}">
                        </option>
                    </select>
                </div>

                <!-- Modèle -->
                <div class="form-group">
                    <label>Modèle</label>
                    <input type="text" th:field="*{modele}" required />
                </div>

                <!-- Statut -->
                <div class="form-group">
                    <label>Statut</label>
                    <select th:field="*{statut}" required>
                        <option value="DISPONIBLE">DISPONIBLE</option>
                        <option value="MAINTENANCE">MAINTENANCE</option>
                        <option value="HORS_SERVICE">HORS SERVICE</option>
                    </select>
                </div>

                <!-- Capacités par classe de siège -->
                <div class="capacity-section">
                    <h3>Capacité par classe de siège</h3>
                    <p style="color: #666; margin-bottom: 15px;">Définissez le nombre de sièges pour chaque classe</p>
                    
                    <div class="capacity-grid">
                        <div th:each="classe : ${classes}" class="capacity-item">
                            <label th:text="${classe.libelle}">Classe</label>
                            <input type="number" 
                                   th:name="'capacite_' + ${classe.idClasse}" 
                                   th:value="${avionCapacites != null ? (avionCapacites[classe.idClasse] != null ? avionCapacites[classe.idClasse] : 0) : 0}" 
                                   min="0" 
                                   placeholder="Nombre de sièges" />
                        </div>
                        <div th:if="${classes == null or classes.isEmpty()}" style="color: #999;">
                            Aucune classe de siège configurée
                        </div>
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 20px;">
                    <button type="submit" class="btn btn-save">
                        Modifier l'avion
                    </button>
                    <a href="/avions" class="btn btn-secondary">
                        Annuler
                    </a>
                </div>
            </form>
        </section>

        <footer class="main-footer">
            <span>© 2026 Compagnie aérienne</span>
        </footer>
    </main>
</div>
</body>
</html>
