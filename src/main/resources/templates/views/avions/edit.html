<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modifier Avion | Compagnie aerienne</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
    <style>
        .capacity-section { margin-top: 20px; }
        .capacity-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .capacity-item { padding: 15px; border: 1px solid #ddd; border-radius: 8px; background: #f9f9f9; }
        .capacity-item label { font-weight: bold; display: block; margin-bottom: 5px; }
        .capacity-value { font-size: 1.5em; color: #1565c0; }
    </style>
</head>

<body>
<div class="app-shell">
    <div th:replace="ui/menu :: menu"></div>

    <main class="main-area">
        <header class="main-header">
            <div>
                <h1>Modifier un avion</h1>
            </div>
            <div class="user-chip">
                <span class="status-dot"></span>
                <span>Module Avions</span>
            </div>
        </header>

        <section class="form-wrapper">
            <form th:action="@{/avions/edit/{id}(id=${avion.idAvion})}"
                  method="post"
                  th:object="${avion}">

                <!-- Compagnie -->
                <div class="form-group">
                    <label>Compagnie</label>
                    <select th:field="*{compagnie}" required>
                        <option value="">Selectionnez une compagnie</option>
                        <option th:each="c : ${compagnies}"
                                th:value="${c.idCompagnie}"
                                th:text="${c.nom}">
                        </option>
                    </select>
                </div>

                <!-- Modele -->
                <div class="form-group">
                    <label>Modele</label>
                    <input type="text" th:field="*{modele}" required />
                </div>

                <!-- Statut -->
                <div class="form-group">
                    <label>Statut</label>
                    <select th:field="*{statut}" required>
                        <option value="DISPONIBLE">DISPONIBLE</option>
                        <option value="MAINTENANCE">MAINTENANCE</option>
                        <option value="HORS_SERVICE">HORS SERVICE</option>
                    </select>
                </div>

                <!-- Capacites par classe (lecture seule) -->
                <div class="capacity-section">
                    <h3>Capacite par classe de siege</h3>
                    <p style="color: #888; margin-bottom: 15px;">
                        Les capacites sont definies lors de la creation de l'avion et ne peuvent pas etre modifiees.
                    </p>
                    
                    <div class="capacity-grid">
                        <div th:each="classe : ${classes}" class="capacity-item">
                            <label th:text="${classe.libelle}">Classe</label>
                            <span class="capacity-value" 
                                  th:text="${avionCapacites != null and avionCapacites[classe.idClasse] != null ? avionCapacites[classe.idClasse] : 0} + ' sieges'">
                            </span>
                        </div>
                        <div th:if="${classes == null or classes.isEmpty()}" style="color: #999;">
                            Aucune classe de siege configuree
                        </div>
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 20px;">
                    <button type="submit" class="btn btn-save">
                        Modifier l'avion
                    </button>
                    <a href="/avions" class="btn btn-secondary">
                        Annuler
                    </a>
                </div>
            </form>
        </section>

        <footer class="main-footer">
            <span>2026 Compagnie aerienne</span>
        </footer>
    </main>
</div>
</body>
</html>
