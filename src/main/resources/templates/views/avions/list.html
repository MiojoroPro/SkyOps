<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flotte | Compagnie aérienne</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<div class="app-shell">
    <div th:replace="ui/menu :: menu"></div>

    <main class="main-area">

        <header class="main-header">
            <div>
                <h1>Flotte aérienne</h1>
            </div>
            <div class="user-chip">
                <span class="status-dot"></span>
                <span>Module Avions</span>
            </div>
        </header>

        <section class="content-section">
            <article class="card">
                <p class="badge">Inventaire</p>
                <h2 class="section-title">Vue d'ensemble</h2>
                <p class="module-description">Nombre d'appareils suivis</p>
                <h3 th:text="${avions.size()} + ' avions'"></h3>
            </article>
        </section>

        <section class="table-wrapper">
            <header>
                <h2 class="section-title">Avions référencés</h2>
                <a href="/avions/add" class="btn btn-add">Ajouter</a>
            </header>

            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Compagnie</th>
                        <th>Modèle</th>
                        <th>Capacité</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="avion : ${avions}">
                        <td th:text="${avion.idAvion}"></td>
                        <td th:text="${avion.compagnie.nom}"></td>
                        <td th:text="${avion.modele}"></td>
                        <td>
                            <span th:each="ac, stat : ${avion.avionClasses}" 
                                  th:text="${ac.classeSiege.code} + ': ' + ${ac.capacite} + (${!stat.last} ? ' / ' : '')">
                            </span>
                            <span th:if="${avion.avionClasses == null or avion.avionClasses.isEmpty()}" style="color: #999;">
                                Non défini
                            </span>
                            <em style="color: #666;" th:text="' (Total: ' + ${avion.capaciteTotale} + ')'"></em>
                        </td>
                        <td>
                            <span th:switch="${avion.statut}">
                                <span th:case="'DISPONIBLE'" class="badge" style="background:#4caf50;color:white">DISPONIBLE</span>
                                <span th:case="'MAINTENANCE'" class="badge" style="background:#ff9800;color:white">MAINTENANCE</span>
                                <span th:case="'HORS_SERVICE'" class="badge" style="background:#f44336;color:white">HORS SERVICE</span>
                                <span th:case="*" th:text="${avion.statut}"></span>
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/avions/edit/{id}(id=${avion.idAvion})}" class="btn-edit">Modifier</a>
                            <a th:href="@{/avions/delete/{id}(id=${avion.idAvion})}"
                               class="btn-delete"
                               onclick="return confirm('Supprimer cet avion ?')">
                                Supprimer
                            </a>
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>
        </section>

        <footer class="main-footer">
            <span>© 2026 Compagnie aérienne</span>
        </footer>

    </main>
</div>

</body>
</html>
