<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recette maximale des vols</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="ui/menu :: menu"></div>
    <main class="main-area">
        <header class="main-header">
            <div>
                <h1>Recette maximale — Vols</h1>
            </div>
            <div>
                <a href="/vol" class="btn btn-secondary">Voir Vols</a>
            </div>
        </header>

        <section class="table-wrapper">
            <header>
                <h2 class="section-title">Recette maximale potentielle par vol</h2>
            </header>

            <form method="get" th:action="@{/vol/max-revenue}" class="filter-form">
                <div class="filter-panel">
                    <div class="filter-grid">
                        <div class="form-row filter-item">
                            <label>Début</label>
                            <input type="date" name="startDate" th:value="${startDate}" />
                        </div>

                        <div class="form-row filter-item">
                            <label>Fin</label>
                            <input type="date" name="endDate" th:value="${endDate}" />
                        </div>

                        <div class="form-row filter-item">
                            <label>Avion</label>
                            <select name="avionId">
                                <option value="">Tous</option>
                                <option th:each="a : ${avions}" th:value="${a.idAvion}" th:text="${a.modele} + ' (' + ${a.compagnie != null ? a.compagnie.nom : ''} + ')'"
                                        th:selected="${avionId != null and a.idAvion == avionId}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="filter-actions">
                        <button type="submit" class="btn btn-apply">Filtrer</button>
                        <a href="/vol/max-revenue" class="btn btn-secondary">Réinitialiser</a>
                    </div>
                </div>
            </form>

            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Numéro</th>
                            <th>Compagnie</th>
                            <th>Recette potentielle</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="vol : ${vols}">
                            <td th:text="${vol.idVol}"></td>
                            <td th:text="${vol.numeroVol}"></td>
                            <td th:text="${vol.compagnie != null ? vol.compagnie.nom : '-'}"></td>
                            <td th:text="${totals[vol.idVol] != null ? #numbers.formatDecimal(totals[vol.idVol],0,0) + ' MGA' : '—'}"></td>
                            <td>
                                <a th:href="@{/vol/{id}/max-revenue(id=${vol.idVol})}" class="btn btn-edit">Voir détails</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>

    </main>
</div>
</body>
</html>
