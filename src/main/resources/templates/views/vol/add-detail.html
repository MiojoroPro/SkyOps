<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Planifier une exécution - ' + ${vol.numeroVol}">Ajouter Exécution</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .price-matrix { margin-top: 20px; }
        .price-matrix table { width: 100%; border-collapse: collapse; }
        .price-matrix th, .price-matrix td { padding: 10px; border: 1px solid #ddd; text-align: center; }
        .price-matrix th { background: #f5f5f5; }
        .price-matrix input { width: 120px; text-align: right; }
        .places-section { margin-top: 20px; }
        .places-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .place-item { padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .place-item label { font-weight: bold; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="app-shell">
    <div th:replace="ui/menu :: menu"></div>

    <main class="main-area">

        <header class="main-header">
            <div>
                <h1 th:text="'Planifier une exécution - ' + ${vol.numeroVol}"></h1>
            </div>
        </header>

        <section class="content-section">
            <article class="card">

                <form th:action="@{/vol/{id}/details/add(id=${vol.idVol})}" th:object="${newDetail}" method="post">

                    <h3>Informations générales</h3>
                    
                    <div class="form-group">
                        <label>Avion</label>
                        <select th:field="*{avion.idAvion}" required>
                            <option value="">Sélectionner un avion</option>
                            <option th:each="av : ${avions}"
                                    th:value="${av.idAvion}"
                                    th:text="${av.modele} + ' (' + ${av.compagnie.nom} + ')'">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Date / Heure départ</label>
                        <input type="datetime-local" th:field="*{dateHeureDepart}" required />
                    </div>

                    <div class="form-group">
                        <label>Date / Heure arrivée</label>
                        <input type="datetime-local" th:field="*{dateHeureArrivee}" required />
                    </div>

                    <div class="form-group">
                        <label>Statut</label>
                        <select th:field="*{statut}" required>
                            <option value="">Sélectionner un statut</option>
                            <option value="PROGRAMME">PROGRAMMÉ</option>
                            <option value="CONFIRME">CONFIRMÉ</option>
                        </select>
                    </div>

                    <!-- Places par classe -->
                    <div class="places-section">
                        <h3>Places disponibles par classe</h3>
                        <p style="color: #666; margin-bottom: 15px;">Définissez le nombre de places pour chaque classe de siège</p>
                        
                        <div class="places-grid">
                            <div th:each="classe : ${classes}" class="place-item">
                                <label th:text="${classe.libelle}">Classe</label>
                                <input type="number" 
                                       th:name="'places_' + ${classe.idClasse}" 
                                       min="0" 
                                       value="0" 
                                       placeholder="Nombre de places" />
                            </div>
                        </div>
                    </div>

                    <!-- Prix par classe et catégorie d'âge -->
                    <div class="price-matrix">
                        <h3>Prix par classe et catégorie d'âge</h3>
                        <p style="color: #666; margin-bottom: 15px;">Définissez les prix en MGA pour chaque combinaison classe/catégorie</p>
                        
                        <table>
                            <thead>
                                <tr>
                                    <th>Classe / Catégorie</th>
                                    <th th:each="categorie : ${categories}" th:text="${categorie.libelle}">Catégorie</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="classe : ${classes}">
                                    <th th:text="${classe.libelle}">Classe</th>
                                    <td th:each="categorie : ${categories}">
                                        <input type="number" 
                                               th:name="'prix_' + ${classe.idClasse} + '_' + ${categorie.idCategorie}" 
                                               min="0" 
                                               step="0.01"
                                               placeholder="Prix MGA" />
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="form-actions" style="margin-top: 30px;">
                        <button type="submit" class="btn btn-edit">Créer l'exécution</button>
                        <a th:href="@{/vol/{id}/details(id=${vol.idVol})}" class="btn btn-secondary">Annuler</a>
                    </div>

                </form>
            </article>
        </section>

        <footer class="main-footer">
            <span>© 2026 Compagnie aérienne</span>
        </footer>

    </main>
</div>

</body>
</html>
