<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Détails du vol ' + ${vol.numeroVol}">Détails Vol</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .class-badges { display: flex; gap: 5px; flex-wrap: wrap; }
        .class-badge { 
            padding: 3px 8px; 
            border-radius: 4px; 
            font-size: 0.85em; 
            background: #e3f2fd; 
            color: #1565c0; 
        }
    </style>
</head>
<body>

<div class="app-shell">
    <div th:replace="ui/menu :: menu"></div>

    <main class="main-area">

        <header class="main-header">
            <div>
                <h1 th:text="'Détails du vol ' + ${vol.numeroVol}"></h1>
            </div>
            <div>
                <a th:href="@{/vol/{id}/details/add(id=${vol.idVol})}" class="btn btn-apply">+ Ajouter exécution</a>
                <a th:href="@{/reservations/vol/{id}(id=${vol.idVol})}" class="btn btn-edit">Voir réservations</a>
                <a th:href="@{/vol/{id}/max-revenue(id=${vol.idVol})}" class="btn btn-secondary">Recette max</a>
            </div>
        </header>

        <section class="table-wrapper">
            <header>
                <h2 class="section-title">Exécutions programmées</h2>
            </header>

            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Avion</th>
                        <th>Date / Heure depart</th>
                        <th>Date / Heure arrivee</th>
                        <th>Places disponibles</th>
                        <th>Places reservees</th>
                        <th>CA Reel</th>
                        <th>Recette max</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="detail : ${details}">
                        <td th:text="${detail.idVolDetail}"></td>
                        <td th:text="${detail.avion != null ? detail.avion.modele : ''}"></td>
                        <td th:text="${#temporals.format(detail.dateHeureDepart,'yyyy-MM-dd HH:mm')}"></td>
                        <td th:text="${#temporals.format(detail.dateHeureArrivee,'yyyy-MM-dd HH:mm')}"></td>
                        <td>
                            <div class="class-badges">
                                <span th:each="vc : ${detail.volClasses}" 
                                      class="class-badge"
                                      th:text="${vc.classeSiege.code} + ': ' + ${vc.placesRestantes}">
                                </span>
                                <span th:if="${detail.volClasses == null or detail.volClasses.isEmpty()}" 
                                      style="color: #999;">Non defini</span>
                            </div>
                        </td>
                        <td>
                            <span class="badge" style="background:#2196f3;color:white" 
                                  th:text="${detail.nombrePlacesReservees} + ' place(s)'"></span>
                        </td>
                        <td>
                            <span style="color:#4caf50;font-weight:bold" 
                                  th:text="${detail.chiffreAffairesReel != null ? #numbers.formatDecimal(detail.chiffreAffairesReel,0,0) + ' MGA' : '0 MGA'}"></span>
                        </td>
                        <td th:text="${detail.maxRevenue != null ? #numbers.formatDecimal(detail.maxRevenue,0,0) + ' MGA' : '—'}"></td>
                        <td>
                            <span th:switch="${detail.statut}">
                                <span th:case="'PROGRAMME'" class="badge">PROGRAMMÉ</span>
                                <span th:case="'CONFIRME'" class="badge" style="background:#4caf50;color:white">CONFIRMÉ</span>
                                <span th:case="'ANNULÉ'" class="badge" style="background:#f44336;color:white">ANNULÉ</span>
                                <span th:case="'TERMINE'" class="badge" style="background:#9e9e9e;color:white">TERMINÉ</span>
                                <span th:case="*" th:text="${detail.statut}"></span>
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/reservations/book/{id}(id=${detail.idVolDetail})}" class="btn btn-apply">Réserver</a>
                            <a th:href="@{/vol/details/delete/{id}(id=${detail.idVolDetail})}"
                               class="btn-delete"
                               onclick="return confirm('Supprimer cette exécution ?')">Supprimer</a>
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>
        </section>

        <footer class="main-footer">
            <span>© 2026 Compagnie aérienne</span>
        </footer>

    </main>
</div>

</body>
</html>
