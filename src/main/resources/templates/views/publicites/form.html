<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicité | Compagnie aerienne</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{ui/menu :: menu}"></div>
    <main class="main-area">
        <div class="main-header">
            <div>
                <p class="eyebrow">Publicités</p>
                <h1 th:text="${publicite.idPublicite != null} ? 'Modifier la publicité' : 'Nouvelle publicité'">Publicité</h1>
            </div>
        </div>

        <div class="table-wrapper">
            <form th:action="@{/publicites/save}" method="post" style="padding: 24px;">
                <input type="hidden" th:value="${publicite.idPublicite}" name="idPublicite" />
                
                <div class="form-group" style="margin-bottom: 16px;">
                    <label>Titre *</label>
                    <input type="text" name="titre" th:value="${publicite.titre}" required style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;" />
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label>Société *</label>
                    <select name="societeId" required style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;">
                        <option value="">-- Sélectionner --</option>
                        <option th:each="s : ${societes}" th:value="${s.idSociete}" th:text="${s.nom}" 
                                th:selected="${publicite.societe != null and publicite.societe.idSociete == s.idSociete}"></option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label>Durée (secondes) *</label>
                    <input type="number" name="dureeSeconde" th:value="${publicite.dureeSeconde}" required min="1" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;" />
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label>Description</label>
                    <textarea name="description" rows="4" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;" th:text="${publicite.description}"></textarea>
                </div>

                <div style="display:flex;gap:10px;">
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                    <a href="/publicites" class="btn btn-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
