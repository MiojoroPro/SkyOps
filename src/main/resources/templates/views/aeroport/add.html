<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter Aéroport | Compagnie aérienne</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="ui/menu :: menu"></div>

    <main class="main-area">
        <header class="main-header">
            <div>
                <p class="eyebrow">Gestion</p>
                <h1>Ajouter un Aéroport</h1>
            </div>
            <div class="user-chip">
                <span class="status-dot"></span>
                <span>Module Aéroports</span>
            </div>
        </header>

        <section class="content-section">
            <form th:action="@{/aeroports/add}" th:object="${aeroport}" method="post" class="form-card">
                <div class="form-group">
                    <label>Code IATA :</label>
                    <input type="text" th:field="*{codeIata}" required/>
                </div>
                <div class="form-group">
                    <label>Nom :</label>
                    <input type="text" th:field="*{nom}" required/>
                </div>
                <div class="form-group">
                    <label>Pays :</label>
                    <input type="text" th:field="*{pays}" required/>
                </div>
                <div class="form-group">
                    <label>Ville :</label>
                    <input type="text" th:field="*{ville}" required/>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Enregistrer</button>
                    <a th:href="@{/aeroports}" class="btn-secondary">Annuler</a>
                </div>
            </form>
        </section>

        <footer class="main-footer">
            <span>© 2026 Compagnie aérienne</span>
        </footer>
    </main>
</div>
</body>
</html>
